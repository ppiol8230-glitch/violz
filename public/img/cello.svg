<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 680" role="img" aria-label="Cello line drawing">
<style>.s{fill:none;stroke:#262019;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.a{stroke:#9c6a38;stroke-width:1.3}.t{stroke-width:1.4}</style>
