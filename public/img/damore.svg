<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 660" role="img" aria-label="Viola d'amore line drawing">
<style>.s{fill:none;stroke:#262019;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.a{stroke:#9c6a38;stroke-width:1.1}.t{stroke-width:1.3}.g{stroke:#c3a06a;stroke-width:.9}</style>
<g class="s" transform="translate(115,0)">
