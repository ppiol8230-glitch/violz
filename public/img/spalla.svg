<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 560" role="img" aria-label="Violoncello da spalla line drawing">
<style>.s{fill:none;stroke:#262019;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.a{stroke:#9c6a38;stroke-width:1.2}.t{stroke-width:1.3}.g{stroke:#c3a06a;stroke-width:1.4}</style>
<g class="s" transform="translate(134,0)">
  <!-- shoulder strap -->
  <path d="M-52,214 C-78,158 -94,106 -101,44 M-34,222 C-62,160 -78,106 -86,38" class="g"/>
  <!-- body: compact, deep cello form -->
  <path id="bd" d="M0,212 C48,205 86,228 87,270 C87,300 80,320 73,332 C59,338 53,351 53,364 C53,377 60,390 74,397 C92,408 102,434 102,466 C102,504 56,532 0,534"/>
  <use href="#bd" transform="scale(-1,1)"/>
  <!-- f-holes -->
  <g id="fh"><circle cx="38" cy="336" r="5.4"/><path d="M36,345 C30,362 46,380 40,398" class="t"/><circle cx="44" cy="406" r="6.2"/><path d="M31,368 l7,-2 M42,373 l7,-2" class="t"/></g>
  <use href="#fh" transform="scale(-1,1)"/>
  <!-- fingerboard (5-string width) -->
  <path d="M-12,74 L12,74 L17.5,228 C17.5,237 -17.5,237 -17.5,228 Z"/>
  <!-- pegbox : 5 pegs -->
  <path d="M-10,74 C-11,58 -11,46 -8.5,34 M10,74 C11,58 11,46 8.5,34"/>
  <path d="M-11,46 h-14 M-11,60 h-14 M11,40 h14 M11,54 h14 M11,68 h14" class="t"/>
  <ellipse cx="-27" cy="46" rx="3.6" ry="4.8"/><ellipse cx="-27" cy="60" rx="3.6" ry="4.8"/>
  <ellipse cx="27" cy="40" rx="3.6" ry="4.8"/><ellipse cx="27" cy="54" rx="3.6" ry="4.8"/><ellipse cx="27" cy="68" rx="3.6" ry="4.8"/>
  <!-- scroll -->
  <path d="M-8.5,34 C-12,24 -12.5,14 -8.5,8 C-4,1 8,1 11,8 C14,15 12,23 8,29 C5,34 0,35 -2,31 C-4,27 -2,23 1,23"/>
  <!-- strings x5 -->
  <g class="a"><path d="M-6.5,77 L-13.5,416 M-3.2,77 L-6.7,416 M0,77 L0,416 M3.2,77 L6.7,416 M6.5,77 L13.5,416"/></g>
  <!-- bridge -->
  <path d="M-19,402 L19,402 L15,376 L-15,376 Z" class="t"/>
  <!-- tailpiece -->
  <path d="M-11,416 C-13.5,452 -8.5,476 0,485 C8.5,476 13.5,452 11,416 Z"/>
  <path d="M0,485 L0,530" class="t"/>
  <circle cx="0" cy="534" r="3.2" class="t"/>
</g>
</svg>
