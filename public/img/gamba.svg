<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 660" role="img" aria-label="Viola da gamba line drawing">
<style>.s{fill:none;stroke:#262019;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.a{stroke:#9c6a38;stroke-width:1.1}.t{stroke-width:1.3}</style>
<g class="s" transform="translate(115,0)">
  <!-- body: sloped shoulders, deep waist -->
  <path id="bd" d="M0,292 C18,293 40,306 52,332 C61,352 63,374 57,390 C47,398 43,410 43,422 C43,434 48,446 59,452 C75,462 85,488 85,522 C85,562 48,600 0,602"/>
  <use href="#bd" transform="scale(-1,1)"/>
  <!-- C-holes -->
  <g id="ch"><path d="M32,430 C23,440 23,460 32,470" class="t"/><circle cx="33.5" cy="428" r="1.7" class="t"/><circle cx="33.5" cy="472" r="1.7" class="t"/></g>
  <use href="#ch" transform="scale(-1,1)"/>
  <!-- fingerboard -->
  <path d="M-11,108 L11,108 L16.5,312 C16.5,321 -16.5,321 -16.5,312 Z"/>
  <!-- frets -->
  <path d="M-11.6,130 L11.6,130 M-12.2,156 L12.2,156 M-12.8,182 L12.8,182 M-13.4,208 L13.4,208 M-14,234 L14,234 M-14.6,260 L14.6,260 M-15.2,286 L15.2,286" class="t"/>
  <!-- pegbox : 3+3 pegs -->
  <path d="M-9,108 C-10,90 -10,74 -7.5,58 M9,108 C10,90 10,74 7.5,58"/>
  <path d="M-10,70 h-13 M-10,84 h-13 M-10,98 h-13 M10,64 h13 M10,78 h13 M10,92 h13" class="t"/>
  <ellipse cx="-25" cy="70" rx="3.3" ry="4.4"/><ellipse cx="-25" cy="84" rx="3.3" ry="4.4"/><ellipse cx="-25" cy="98" rx="3.3" ry="4.4"/>
  <ellipse cx="25" cy="64" rx="3.3" ry="4.4"/><ellipse cx="25" cy="78" rx="3.3" ry="4.4"/><ellipse cx="25" cy="92" rx="3.3" ry="4.4"/>
  <!-- scroll -->
  <path d="M-7.5,58 C-11,46 -11.5,35 -7.5,28 C-3.5,21 7.5,21 10.5,28 C13.5,35 11.5,44 7.5,51 C4.5,56 -0.5,57 -2.5,53 C-4.5,49 -2.5,45 0.5,45"/>
  <!-- strings x6 -->
  <g class="a"><path d="M-8,111 L-15,478 M-4.8,111 L-9,478 M-1.6,111 L-3,478 M1.6,111 L3,478 M4.8,111 L9,478 M8,111 L15,478"/></g>
  <!-- bridge (wider, arched) -->
  <path d="M-20,465 L20,465 L16,438 C10,434 -10,434 -16,438 Z" class="t"/>
  <!-- tailpiece -->
  <path d="M-11,478 C-13,516 -8,542 0,551 C8,542 13,516 11,478 Z"/>
  <path d="M0,551 L0,598" class="t"/>
  <circle cx="0" cy="602" r="3" class="t"/>
</g>
</svg>
